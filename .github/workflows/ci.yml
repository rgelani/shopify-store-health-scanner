name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # -------------------- Backend CI --------------------
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if backend changed
        id: backend-changed
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
      
      - name: Setup Python
        if: steps.backend-changed.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        if: steps.backend-changed.outputs.backend == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Lint with flake8
        if: steps.backend-changed.outputs.backend == 'true'
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Format check with black
        if: steps.backend-changed.outputs.backend == 'true'
        run: black --check --diff .
      
      - name: Type check with mypy
        if: steps.backend-changed.outputs.backend == 'true'
        run: mypy . --ignore-missing-imports
        continue-on-error: true
      
      - name: Run tests
        if: steps.backend-changed.outputs.backend == 'true'
        run: pytest --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        if: steps.backend-changed.outputs.backend == 'true'
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend

  # -------------------- Frontend CI --------------------
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if frontend changed
        id: frontend-changed
        uses: dorny/paths-filter@v2
        with:
          filters: |
            frontend:
              - 'frontend/**'
      
      - name: Setup Node
        if: steps.frontend-changed.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        if: steps.frontend-changed.outputs.frontend == 'true'
        run: npm ci
      
      - name: Lint with ESLint
        if: steps.frontend-changed.outputs.frontend == 'true'
        run: npm run lint
        continue-on-error: true
      
      - name: Format check with Prettier
        if: steps.frontend-changed.outputs.frontend == 'true'
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}"
        continue-on-error: true
      
      - name: Type check
        if: steps.frontend-changed.outputs.frontend == 'true'
        run: npx tsc --noEmit
        continue-on-error: true
      
      - name: Build
        if: steps.frontend-changed.outputs.frontend == 'true'
        run: npm run build
      
      - name: Run tests
        if: steps.frontend-changed.outputs.frontend == 'true'
        run: npm test -- --run
        continue-on-error: true

  # -------------------- Docker Build Test --------------------
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if backend changed
        id: backend-changed
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
      
      - name: Set up Docker Buildx
        if: steps.backend-changed.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        if: steps.backend-changed.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: shopify-scanner-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max