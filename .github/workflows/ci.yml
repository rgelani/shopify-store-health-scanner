name: Full CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'

jobs:

  # -------------------- Backend CI --------------------
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    if: ${{ github.event_name == 'push' && contains(join(github.event.commits.*.modified), 'backend/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint & format
        run: |
          pip install flake8 black
          black --check .
          flake8 .

      - name: Type check
        run: |
          pip install mypy
          mypy .

      - name: Run tests
        run: pytest

  # -------------------- Frontend CI --------------------
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    if: ${{ github.event_name == 'push' && contains(join(github.event.commits.*.modified), 'frontend/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: |
          npm install eslint
          npx eslint src/

      - name: Type check (if TS)
        run: npx tsc --noEmit || echo "Skip if not TS"

      - name: Run frontend tests
        run: npm run test -- --watchAll=false
